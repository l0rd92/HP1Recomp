; HP1Recomp input mapping. PSX buttons are active when any listed source is pressed.
; SDL uses Xbox-style source names even for other controllers. On DualSense:
; a = Cross, b = Circle, x = Square, y = Triangle.

[controller]
enabled = true
device = 0
deadzone = 12000

[mapping]
up = dpup,lefty-
down = dpdown,lefty+
left = dpleft,leftx-
right = dpright,leftx+
cross = a
circle = b
square = x
triangle = y
l1 = leftshoulder
r1 = rightshoulder
l2 = lefttrigger
r2 = righttrigger
l3 = leftstick
r3 = rightstick
start = start
select = back
